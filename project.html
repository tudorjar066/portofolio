<!DOCTYPE html>
<html lang="nl-BE">
<head>

<body class="text-gray-800 font-sans pb-8">

    <div class="max-w-6xl mx-auto px-4">

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <img src="images/placeholder.png" alt="Eerste extra afbeelding van het project" width="1200" height="800" class="w-full aspect-[2/1] md:aspect-[4/1] lg:aspect-[5/1] object-cover border border-gray-400">
